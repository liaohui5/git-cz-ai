[package]
name = "git-cz-ai"
version = "0.0.7"
edition = "2021"
authors = ["liaohui5"]
description = "A simple commitizen CLI tool in rust"
homepage ="https://github.com/liaohui5/git-cz-ai"
repository = "https://github.com/liaohui5/git-cz-ai"
license-file = "LICENSE"
readme = "README.md"
keywords = ["git", "commitizen", "cli", "rust", "ai"]
categories = ["development-tools"]

[dependencies]
clap = "4.6.6"
git2 = "0.21.0"
inquire = { version = "0.9.4", features = ["editor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
ureq = { version = "3", features = ["json"] }

[[bin]]
name = "git-cz"
path = "src/main.rs"
